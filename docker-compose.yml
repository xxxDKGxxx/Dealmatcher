services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: dealmatcher-sqlserver
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=Password1!
    ports:
      - "1433:1433"
    volumes:
      - dealmatcher-sql-data:/var/opt/mssql
    networks:
      - dealmatcher-local

  redis:
    image: redis:7-alpine
    container_name: dealmatcher-redis
    command: redis-server --requirepass ${Redis__Password}
    ports:
      - "6379:6379"
    networks:
      - dealmatcher-local

  backend:
    build:
      context: ./src/backend/
      dockerfile: Dockerfile
    container_name: dealmatcher-backend
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:80
      - ConnectionStrings__DefaultConnection=${ConnectionStrings__DefaultConnection}
      - AllowedUrls__0=http://localhost:8080
      - Authentication__Jwt__SecretKey=${Authentication__Jwt__SecretKey}
      - Authentication__Jwt__Issuer=${Authentication__Jwt__Issuer}
      - Authentication__Jwt__Audience=${Authentication__Jwt__Audience}
      - ConnectionStrings__AzureBlobStorage=${ConnectionStrings__AzureBlobStorage}
      - ConnectionStrings__Redis=${ConnectionStrings__Redis}
    ports:
      - "5000:80"
    networks:
      - dealmatcher-local
    depends_on:
      - sqlserver

  frontend:
    build:
      context: ./src/frontend
      dockerfile: Dockerfile
    container_name: dealmatcher-frontend
    ports:
      - "8080:80"
    networks:
      - dealmatcher-local
    depends_on:
      - backend
      
networks:
  dealmatcher-local:
    driver: bridge

volumes:
  dealmatcher-sql-data:
